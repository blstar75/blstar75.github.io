bio: |
  Hyeong Jun Ahn is an Associate Professor in the Department of Quantitative
  Health Sciences at the University of Hawaiʻi John A. Burns School of
  Medicine and Director of the Biostatistics Core Facility. His work integrates
  applied biostatistics, healthcare data analytics, research design, and
  clinical artificial intelligence to support biomedical, clinical, and
  translational research in Hawaiʻi.

